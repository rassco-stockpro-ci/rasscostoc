name: Quality Gates

# Phase 3 — Testing, Release Gates & Engineering Governance.
# TD-03 — CI/CD Activation & Merge Protection.
#
# Every job here runs against an isolated PostgreSQL service container that
# lives only for the duration of the workflow run. This pipeline never reads
# a repository secret named DATABASE_URL and never connects to any
# persistent/production database. No job here has permission to write
# outside its own ephemeral runner or read production credentials.
#
# NOTE (TD-01 documented blocker): `drizzle-kit generate` is intentionally
# never run in this workflow. The migration snapshot chain
# (migrations/meta/*.json) has a documented gap for migrations 0017-0028 —
# see the Technical Debt 01 report — meaning `generate` currently produces
# a stale, duplicate diff and cannot be trusted to validate anything. This
# workflow validates migrations by replaying the committed .sql files
# (`db:migrate`) into a disposable database and diffing the result, not by
# regenerating them.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: quality-gates-${{ github.ref }}
  cancel-in-progress: true

env:
  # Node is pinned in .nvmrc (same version production runs); every job
  # installs it via setup-node's node-version-file.
  # Throwaway, ephemeral service-container credentials only — this database
  # exists for the lifetime of a single job and is discarded by the runner
  # afterward. Kept as separate, individually named variables rather than
  # one assembled connection-string literal: no line anywhere in this file
  # spells out a full `postgres://user:password@host/db` URL. Each job that
  # needs a connection string composes it at runtime (see "Compose
  # DATABASE_URL" steps below), from these pieces, into $GITHUB_ENV.
  POSTGRES_USER: ci_test
  POSTGRES_PASSWORD: ci_test
  POSTGRES_DB: ci_test_db
  POSTGRES_HOST: localhost
  POSTGRES_PORT: "5432"

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: node scripts/secret-scan.cjs --all

  architecture:
    name: Architecture lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint:architecture

  architecture-strict:
    name: Architecture lint (strict)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint:architecture:strict

  typecheck:
    name: Typecheck (check)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check

  typecheck-full:
    name: Typecheck (check:full)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check:full

  backend-build:
    name: Backend build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Release mode: refuses a dirty tree, wrong Node, or a bundle needing
      # packages a production install (npm ci --omit=dev) would not contain.
      - run: npm run build:release
      - name: Release identity regression (pre-deploy guard)
        run: bash scripts/pre-deploy-guard-release-sha.test.sh
      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-build-log
          path: dist/meta.json
          retention-days: 7
          if-no-files-found: ignore

  unit-safe:
    name: Unit tests (safe, no DB)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:unit:safe

  migration-validation:
    name: Migration from zero + drift check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        # services.<id>.env cannot reference the workflow-level `env`
        # context (GitHub Actions restriction — only literals/secrets/vars
        # are allowed here), so these individual, non-connection-string
        # fields are necessarily literal. They must still match the
        # POSTGRES_USER/POSTGRES_PASSWORD/POSTGRES_DB values above.
        env:
          POSTGRES_USER: ci_test
          POSTGRES_PASSWORD: ci_test
          POSTGRES_DB: ci_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Compose DATABASE_URL (built at runtime from decomposed credentials — never hardcoded as one literal)
        run: |
          echo "DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}" >> "$GITHUB_ENV"
          echo "TEST_DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}" >> "$GITHUB_ENV"
      - name: Migrate from zero
        run: npx tsx scripts/migrate.ts
      - name: Verify migration 0028 landed (courier_audit_logs columns)
        env:
          PGPASSWORD: ${{ env.POSTGRES_PASSWORD }}
        run: |
          COUNT=$(psql -h "$POSTGRES_HOST" -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tAc \
            "select count(*) from information_schema.columns where table_name='courier_audit_logs' and column_name in ('actor_name_snapshot','actor_role_snapshot','actor_avatar_url','action_type','action_description','source','status','metadata','ip_address','device_id')")
          echo "courier_audit_logs reconciled columns found: $COUNT / 10"
          if [ "$COUNT" -ne 10 ]; then
            echo "::error::migration 0028 did not apply cleanly (expected 10 reconciled columns, found $COUNT)"
            exit 1
          fi
      - name: Drift check (schema.ts vs migrated DB — safe, isolated only)
        run: node scripts/erp008-drift-check.mjs --allow-test-db
      - name: Cleanup note
        if: always()
        run: echo "Service container is torn down automatically by the runner at job end; no manual cleanup needed."

  isolated-tests:
    name: Backend tests (isolated DB)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        # services.<id>.env cannot reference the workflow-level `env`
        # context (GitHub Actions restriction — only literals/secrets/vars
        # are allowed here), so these individual, non-connection-string
        # fields are necessarily literal. They must still match the
        # POSTGRES_USER/POSTGRES_PASSWORD/POSTGRES_DB values above.
        env:
          POSTGRES_USER: ci_test
          POSTGRES_PASSWORD: ci_test
          POSTGRES_DB: ci_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Compose DATABASE_URL (built at runtime from decomposed credentials — never hardcoded as one literal)
        run: |
          echo "DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}" >> "$GITHUB_ENV"
      - name: Migrate test database
        run: npx tsx scripts/migrate.ts
      - name: Run full backend test suite against the isolated service DB
        env:
          # Not real secrets — dummy values satisfying the app's required-env-var
          # guards (session.ts, jwt.config.ts). Locally these come from .env;
          # the runner has no .env, so they must be supplied explicitly here.
          SESSION_SECRET: ci-isolated-tests-dummy-session-secret-not-for-production
          JWT_SECRET: ci-isolated-tests-dummy-jwt-secret-not-for-production
          # ERP-008: registerRoutes() bootstraps a default admin account on an
          # empty DB (this service container always starts empty) and refuses
          # to do so without a real 12+ char password — the security-foundation
          # test suite (Phase B1.5) is picked up by this unfiltered `vitest run`
          # and exercises that same code path. Not a real secret — same dummy
          # pattern as scripts/test-isolated.mjs / scripts/test-security.mjs.
          BOOTSTRAP_ADMIN_PASSWORD: ci-isolated-bootstrap-admin-password-not-for-production
        run: npx vitest run
      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-report
          path: |
            **/vitest-report/**
          retention-days: 7
          if-no-files-found: ignore

  http-tests:
    name: Backend HTTP tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:http
      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: http-tests-report
          path: |
            **/vitest-report/**
          retention-days: 7
          if-no-files-found: ignore

  database-tests:
    name: Backend database foundation tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # scripts/test-database.mjs manages its own disposable Postgres
      # container via `docker run` (Docker is preinstalled on
      # ubuntu-latest runners) — no services: block needed here, the
      # script's own try/finally guarantees cleanup regardless of pass/fail.
      - run: npm run test:database
      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: database-tests-report
          path: |
            **/vitest-report/**
          retention-days: 7
          if-no-files-found: ignore

  security-tests:
    name: Backend security tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # scripts/test-security.mjs manages its own disposable Postgres
      # container (same pattern as test-database.mjs above) and boots the
      # real production app (registerRoutes against apps/api/src/app.ts)
      # against it — never a shared or production database/secret.
      - run: npm run test:security
      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: security-tests-report
          path: |
            **/vitest-report/**
          retention-days: 7
          if-no-files-found: ignore

  portal-component:
    name: Portal component tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:portal
      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: portal-component-report
          path: |
            **/vitest-report/**
          retention-days: 7
          if-no-files-found: ignore

  portal-playwright:
    name: Portal Playwright smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # No backend secrets/API keys are read here or baked into the built
      # bundle — build:packages + vite build produce a static SPA that
      # reads its API base URL at runtime, never at build time.
      - run: npm run build:packages
      - run: npx vite build
      - name: Install Chromium (Playwright)
        run: npx playwright install --with-deps chromium
      # playwright.config.ts's webServer boots `vite preview` against the
      # just-built dist/public locally (127.0.0.1) — this job never points
      # at any deployed/production URL, and the login-form smoke test it
      # runs makes no real backend API call.
      - run: npx playwright test
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/**
            test-results/**
          retention-days: 7
          if-no-files-found: ignore

  quality-summary:
    name: Final quality summary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - secret-scan
      - architecture
      - architecture-strict
      - typecheck
      - typecheck-full
      - backend-build
      - unit-safe
      - migration-validation
      - isolated-tests
      - http-tests
      - database-tests
      - security-tests
      - portal-component
      - portal-playwright
    if: always()
    steps:
      - name: All gates passed
        if: ${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
        run: echo "✅ All Quality Gates jobs passed."
      - name: Some gates failed
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo "❌ One or more Quality Gates jobs failed or were cancelled."
          exit 1
